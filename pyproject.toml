[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xcim-cli"
version = "0.2.0"
description = "Read-only XCIM integration diagnostics for people and agents"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://xcim.org/tools/"
Source = "https://github.com/saezbaldo/xcim-cli"
Issues = "https://github.com/saezbaldo/xcim-cli/issues"

[project.scripts]
xcim = "xcim_doctor:main"

[tool.setuptools]
py-modules = ["xcim_doctor"]
